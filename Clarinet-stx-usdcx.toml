# Same pattern as Clarinet-sbtc-usdcx.toml: core, ladder and market are
# type-checked locally (they reach each other through `.name`). The rungs,
# dispatch, settle-batch and router bind the market / ladder by the full
# SPV9K21... principal, which is not on chain yet, so they are checked with a
# throwaway copy that rewrites those principals to `.name` (see README).
[contracts.jing-core-v6]
path = "contracts/jing-core-v6.clar"
clarity_version = 5
epoch = "latest"

[contracts.jing-ladder-stx-usdcx-v1]
path = "contracts/stx-usdcx/jing-ladder-stx-usdcx-v1.clar"
clarity_version = 5
epoch = "latest"

[contracts.markets-stx-usdcx-jing-v6-4]
path = "contracts/stx-usdcx/markets-stx-usdcx-jing-v6-4.clar"
clarity_version = 5
