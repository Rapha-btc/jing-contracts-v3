[project]
name = "jing-btc-in-adapter"
description = "BTC-first sponsored swaps: pays the sponsor's STX fee in sats, then routes sBTC to a Jing router or a fak.fun smart buy"
authors = []
telemetry = false
cache_dir = "./.cache"

# The adapter calls the deployed routers by full SPV9K21... principal. The
# routers name their pools and markets through constants, which Clarinet does
# not follow, so every one is listed here. remote_data stays off: with it on,
# `clarinet check` leaves requirements out of the plan and cannot resolve the
# routers. Run: clarinet check --manifest-path Clarinet-btc-in-adapter.toml
# (if a shared deployments/default.simnet-plan.yaml exists, check from a copy).
# Smart-buy trait conformance was verified against the 10 deployed
# *-smart-faktory ABIs (smart-buy-with-sbtc args + ok tuple + uint err).

[[project.requirements]]
contract_id = "SM3VDXK3WZZSA84XXFKAFAF15NNZX32CTSG82JFQ4.sbtc-token"

