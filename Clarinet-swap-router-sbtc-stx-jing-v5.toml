# RV-only manifest for fuzzing swap-router-sbtc-stx-jing-v5 on the v6 fuzz
# market with one mock per AMM. See tests/rv/build.sh section 2h and
# tests/rv/README.md.
#
# Run:
#   bash tests/rv/build.sh markets-sbtc-stx-jing-v6 && bash tests/rv/build.sh swap-router-sbtc-stx-jing-v5
#   npx rv . swap-router-sbtc-stx-jing-v5 invariant --runs=500
#   npx rv . swap-router-sbtc-stx-jing-v5 test --runs=500
[project]
name = "jing-contracts-v3-rv-router-v5"
description = "RV-only manifest for fuzzing swap-router-sbtc-stx-jing-v5"
authors = []
telemetry = false
cache_dir = "./.cache"

[repl.analysis]
passes = []
check_checker = { trusted_sender = false, trusted_caller = false, callee_filter = false }

[contracts.sip-010-trait]
path = "tests/rv/sip-010-trait.clar"
clarity_version = 5
epoch = "3.4"

