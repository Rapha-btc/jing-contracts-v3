# Coverage-instrumented copy of vault-sbtc-stx-v2: identical source with the
# SPV9K21 principal prefix rewritten to relative refs and the Bitflow venues
# rewritten to the RV mocks (the wstx facade's is-standard rejects simnet's
# mixed ST/SM principals), so the manifest deploys it against the local jing
# stack and lcov can measure it. The unit suite drives THIS copy; a sync-guard
# test fails if it drifts from the canonical.
[contracts.vault-sbtc-stx-v2-testable]
path = "contracts/test/vault-sbtc-stx-v2-testable.clar"
clarity_version = 5
epoch = "3.4"

