[project]
name = "jing-contracts-v3"
description = "Jing next deploy set: v6-3 submit + settle market, core-v6, ladder-v1"
authors = []
telemetry = false
cache_dir = "./.cache"

# Only the contracts we intend to deploy next. Everything already live or
# retired is in Clarinet-legacy.toml (the vitest unit tests use that one).
#
# Also in the next deploy set but not declared here, because they name the
# market or ladder by full SPV9K21... principal, which does not resolve in
# simnet until those are on mainnet: swap-router-sbtc-stx-jing-v5-3,
# jing-ladder-dispatch, and the six rung templates (jing-{buy,sell}-stx,
# -market-spread, -core-spread). Check those with their own Clarinet-*.toml
# or on a stxer fork.
#
# Deploy order: jing-core-v6, jing-ladder-v1, jing-rung-deposit-trait,
# markets-sbtc-stx-jing-v6-3, swap-router-sbtc-stx-jing-v5-3,
# jing-ladder-dispatch, then rungs per price.

[[project.requirements]]
contract_id = "SM3VDXK3WZZSA84XXFKAFAF15NNZX32CTSG82JFQ4.sbtc-token"

[[project.requirements]]
contract_id = "SP3FBR2AGK5H9QBDH3EEN6DF8EK8JY7RX8QJ5SVTE.sip-010-trait-ft-standard"

[[project.requirements]]
contract_id = "SPMV5HDZ4EMB8XY7HAYT3XW0DF7DZ4E8XEG2J1T8.pyth-lazer-oracle"

[[project.requirements]]
contract_id = "SPMV5HDZ4EMB8XY7HAYT3XW0DF7DZ4E8XEG2J1T8.pyth-lazer-decoder-v1"

[contracts.jing-core-v6]
path = "contracts/jing-core-v6.clar"
clarity_version = 5
epoch = "3.4"

[contracts.jing-ladder-v1]
path = "contracts/jing-ladder-v1.clar"
clarity_version = 5
epoch = "3.4"

[contracts.jing-rung-deposit-trait]
path = "contracts/jing-rung-deposit-trait.clar"
clarity_version = 5
epoch = "3.4"

[contracts.markets-sbtc-stx-jing-v6-3]
path = "contracts/markets-sbtc-stx-jing-v6-3.clar"
clarity_version = 5
epoch = "3.4"

[repl.remote_data]
enabled = true
api_url = 'https://api.hiro.so'

[repl.analysis]
passes = []
check_checker = { trusted_sender = false, trusted_caller = false, callee_filter = false }
